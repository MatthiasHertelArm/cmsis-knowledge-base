# Publish the core index as the GitHub release core-<version> the CMSIS Developer Assistant pins: the four
# assets scripts/release_core.sh builds from a clean, pushed master. Run it by hand with the version.
name: Release the core index

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the release, the date: YYYY.MM.DD or YYYY.MM.DD.N"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: core-${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the build dependencies
        run: python -m pip install -q -r requirements-build.txt "mcp>=2.2,<3"

      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
          PY: python
        run: scripts/release_core.sh "${{ inputs.version }}"
