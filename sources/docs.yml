# Documentation sources converted by tools/doc2ku.py: mode V only (open licence, full text).
# Order and modes follow docs/design/04_quellenliste.md. Each source is a git clone in .work/docs/<dir>.
#   include/exclude: globs relative to the repository root
#   format: md (default) | doxmd (doxygen-flavoured Markdown) | doxtxt (doxygen comment files and doxygen Markdown)
#   url: published page, {stem} = file name without extension, {page} = doxygen page id, {dir} = folder of the file
#        (minus dir_strip), {name} = name of that folder; default: the file on GitHub
#   sparse: paths of a sparse clone, for large repositories (doc2ku.py --fetch)
#   format hugo (Hugo shortcodes), path_index (title prefix and overview from the folder's _index.md) and
#   id_from_path (ids from folder and file name) serve the Arm Learning Paths in docs-ccbysa.yml
#   domains: path rules that override the default domain
sources:
  - name: cmsis-toolbox
    prefix: tbx
    repo: Open-CMSIS-Pack/cmsis-toolbox
    include: ["docs/*.md"]
    exclude: ["docs/README.md"]
    license: Apache-2.0
    domain: project
    url: "https://open-cmsis-pack.github.io/cmsis-toolbox/{stem}/"
    domains:
      - {paths: ["docs/pack-tools.md"], domain: pack}
      - {paths: ["docs/pyOCD-Debugger.md", "docs/JLink-Debugger.md"], domain: debug}

  - name: pack-spec
    prefix: spec
    repo: Open-CMSIS-Pack/Open-CMSIS-Pack-Spec
    include: ["doxygen/src/*.txt", "doxygen/src/*.md", "doc/Glossary.md"]
    format: doxtxt
    license: Apache-2.0
    domain: pack
    url: "https://open-cmsis-pack.github.io/Open-CMSIS-Pack-Spec/main/html/{page}.html"
    anchors: false

  - name: svd-spec
    prefix: svd
    repo: Open-CMSIS-Pack/svd-spec
    include: ["doxygen/src/*.txt"]
    format: doxtxt
    license: Apache-2.0
    domain: pack
    url: "https://open-cmsis-pack.github.io/svd-spec/main/{page}.html"
    anchors: false

  - name: cmsis-core
    prefix: core
    repo: ARM-software/CMSIS_6
    dir: CMSIS_6
    include: ["CMSIS/Documentation/Doxygen/Core/src/*", "CMSIS/Documentation/Doxygen/General/src/*.md"]
    exclude: ["*/misra.md", "*/ref_deprecated.txt"]
    format: doxtxt
    license: Apache-2.0
    domain: core

  - name: cmsis-rtos2
    prefix: rtos2
    repo: ARM-software/CMSIS_6
    dir: CMSIS_6
    include: ["CMSIS/Documentation/Doxygen/RTOS2/src/*"]
    format: doxtxt
    license: Apache-2.0
    domain: rtos

  - name: cmsis-driver
    prefix: drv
    repo: ARM-software/CMSIS_6
    dir: CMSIS_6
    include: ["CMSIS/Documentation/Doxygen/Driver/src/*"]
    exclude: ["*_Demo.c", "*/vStream_Example.c"]
    format: doxtxt
    license: Apache-2.0
    domain: drivers

  - name: cmsis-rtx
    prefix: rtx
    repo: ARM-software/CMSIS-RTX
    include: ["Documentation/Doxygen/src/*", "Examples/**/README.md"]
    exclude: ["*/misra.md"]
    format: doxtxt
    license: Apache-2.0
    domain: rtos

  - name: cmsis-view
    prefix: view
    repo: ARM-software/CMSIS-View
    include: ["Documentation/Doxygen/src/*", "Examples/**/README.md", "tools/eventlist/README.md"]
    format: doxtxt
    license: Apache-2.0
    domain: trace

  - name: cmsis-compiler
    prefix: cc
    repo: ARM-software/CMSIS-Compiler
    include: ["documentation/doxygen/src/*.md", "example/README.md"]
    format: doxmd
    license: Apache-2.0
    domain: core

  - name: pyocd
    prefix: pyocd
    repo: pyocd/pyOCD
    include: ["docs/*.md", "docs/api/*.md"]
    exclude: ["docs/README.md", "docs/automated_tests.md", "docs/developers_guide.md", "docs/remote_probe_protocol.md", "docs/builtin-targets.md"]
    license: Apache-2.0
    domain: debug

  - name: cmsis-debugger
    prefix: dbgx
    repo: Open-CMSIS-Pack/vscode-cmsis-debugger
    include: ["README.md", "docs/component-viewer/README.md", "docs/trace-configuration/*.md", "configs/core-peripherals/README.md"]
    license: Apache-2.0
    domain: debug

  - name: sds-framework
    prefix: sds
    repo: ARM-software/SDS-Framework
    include: ["documentation/*.md", "layer/**/README.md", "template/**/README.md", "utilities/README.md"]
    license: Apache-2.0
    domain: test

  - name: avh
    prefix: avh
    repo: ARM-software/AVH
    include: ["DoxyGen/**/*.md", "interface/**/README.md", "example/*/README.md"]
    format: doxmd
    license: Apache-2.0
    domain: test

  - name: gen-pack
    prefix: genpack
    repo: Open-CMSIS-Pack/gen-pack
    include: ["README.md"]
    license: Apache-2.0
    domain: pack

  - name: csolution-examples
    prefix: csx
    repo: Open-CMSIS-Pack/csolution-examples
    include: ["README.md", "*/README.md", "Templates/*/README.md"]
    license: Apache-2.0
    domain: project

  - name: vscode-get-started
    prefix: vgs
    repo: Open-CMSIS-Pack/vscode-get-started
    include: ["README.md"]
    license: Apache-2.0
    domain: project

  - name: cmsis-zephyr
    prefix: czep
    repo: Arm-Examples/CMSIS-Zephyr
    include: ["README.md"]
    license: Apache-2.0
    domain: project

  - name: cmsis-actions
    prefix: cact
    repo: ARM-software/cmsis-actions
    include: ["README.md"]
    license: Apache-2.0
    domain: devops

  - name: cda-guides
    prefix: cda
    repo: Open-CMSIS-Pack/CMSIS-Developer-Assistant
    dir: CMSIS-Developer-Assistant
    # debug_instructions.md is left out: get_debug_instructions serves it by topic, and as units it would compete with cmsis-debug-live.
    include: ["docs/agent-resources/cmsis-embedded-guide.md", "docs/agent-resources/troubleshooting/*.md", "docs/agent-resources/tool-contract.md"]
    license: Apache-2.0
    domain: debug

  # ── RTOS ────────────────────────────────────────────────────────────────────
  - name: cmsis-freertos
    prefix: cfrt
    repo: ARM-software/CMSIS-FreeRTOS
    include: ["Documentation/Doxygen/src/*.md", "CMSIS/RTOS2/FreeRTOS/Examples/README.md", "CMSIS/RTOS2/FreeRTOS/RefApp/README.md"]
    format: doxmd
    license: Apache-2.0
    domain: rtos

  - name: threadx
    prefix: threadx
    repo: eclipse-threadx/rtos-docs
    dir: rtos-docs
    include: ["rtos-docs/threadx/*.md"]
    exclude: ["*/index.md", "*/about-this-guide.md"]
    license: MIT
    domain: rtos

  # The ThreadX middleware: file systems, USB, networking, flash wear levelling, trace.
  - name: threadx-middleware
    prefix: txmw
    repo: eclipse-threadx/rtos-docs
    dir: rtos-docs
    # Introduction, installation, functional description and drivers of each product; the service (API)
    # chapters, the add-on protocols and the trace event tables would add 2,000 units for few users.
    include: ["rtos-docs/filex/chapter[12356].md", "rtos-docs/filex/overview-filex.md",
              "rtos-docs/usbx/usbx-device-stack-[123].md", "rtos-docs/usbx/usbx-host-stack-[123].md", "rtos-docs/usbx/overview-usbx.md",
              "rtos-docs/netx-duo/chapter[1235].md", "rtos-docs/netx-duo/overview-netx-duo.md",
              "rtos-docs/levelx/chapter*.md", "rtos-docs/tracex/chapter[1-5].md", "rtos-docs/tracex/chapter1[01].md",
              "rtos-docs/threadx-modules/chapter*.md"]
    exclude: ["*/index.md", "*/about-this-guide.md"]
    license: MIT
    domain: rtos
    domains:
      - {paths: ["rtos-docs/tracex/*"], domain: trace}

  # ── Drivers, DSP, data flow ─────────────────────────────────────────────────
  - name: cmsis-driver-impl
    prefix: drvimpl
    repo: ARM-software/CMSIS-Driver
    include: ["Documentation/Doxygen/src/*.md", "Shield/**/README.md", "WiFi/*/Validation/README.md"]
    format: doxmd
    license: Apache-2.0
    domain: drivers

  - name: cmsis-dsp
    prefix: dsp
    repo: ARM-software/CMSIS-DSP
    include: ["Documentation/Doxygen/src/*.md", "README.md"]
    format: doxmd
    license: Apache-2.0
    domain: optimization

  - name: cmsis-nn
    prefix: nn
    repo: ARM-software/CMSIS-NN
    include: ["Documentation/Doxygen/src/mainpage.md", "README.md"]
    format: doxmd
    license: Apache-2.0
    domain: optimization

  - name: cmsis-stream
    prefix: stream
    repo: ARM-software/CMSIS-Stream
    include: ["Documentation/*.md", "README.md", "platform/*/README.md"]
    license: Apache-2.0
    domain: cmsis-stream

  # ── Test ───────────────────────────────────────────────────────────────────
  - name: unity
    prefix: unity
    repo: ThrowTheSwitch/Unity
    include: ["docs/Unity*.md", "README.md", "extras/*/readme.md"]
    exclude: ["*ChangeLog*", "*KnownIssues*"]
    license: MIT
    domain: test

  - name: cmock
    prefix: cmock
    repo: ThrowTheSwitch/CMock
    include: ["docs/CMock_*.md", "README.md"]
    license: MIT
    domain: test

  # ── Boot and update ────────────────────────────────────────────────────────
  - name: mcuboot
    prefix: mcuboot
    repo: mcu-tools/mcuboot
    include: ["docs/design.md", "docs/imgtool.md", "docs/signed_images.md", "docs/encrypted_images.md", "docs/serial_recovery.md",
              "docs/PORTING.md", "docs/readme-zephyr.md", "docs/ecdsa.md", "docs/custom_crypto.md", "docs/compression_format.md", "README.md"]
    license: Apache-2.0
    domain: boot-update

  # ── Edge AI ────────────────────────────────────────────────────────────────
  - name: tflite-micro
    prefix: tflm
    repo: tensorflow/tflite-micro
    include: ["tensorflow/lite/micro/docs/*.md", "tensorflow/lite/micro/cortex_m_*/README.md", "tensorflow/lite/micro/kernels/README.md",
              "tensorflow/lite/micro/benchmarks/README.md", "debugging_output.md"]
    license: Apache-2.0
    domain: edge-ai

  - name: ml-examples
    prefix: mlx
    repo: ARM-software/ML-examples
    include: ["ethos-u-corstone-300/README.md", "pruning-clustering-ethos-u/README.md", "rnn-unrolling-tflite/README.md"]
    license: Apache-2.0
    domain: edge-ai

  - name: zephyr
    prefix: zep
    repo: zephyrproject-rtos/zephyr
    sparse: [doc/build/dts, doc/build/kconfig, doc/develop/debug, doc/develop/test, doc/develop/west, doc/hardware/arch,
             doc/kernel, doc/services/logging, doc/services/shell, doc/hardware/porting, doc/develop/getting_started,
             doc/services/tracing, doc/hardware/pinctrl]
    include: ["doc/kernel/**/*.rst", "doc/build/dts/*.rst", "doc/build/kconfig/*.rst", "doc/develop/west/*.rst",
              "doc/develop/test/*.rst", "doc/develop/debug/*.rst", "doc/services/logging/*.rst", "doc/services/shell/*.rst",
              "doc/hardware/arch/arm_cortex_m.rst", "doc/hardware/arch/semihost.rst",
              "doc/hardware/porting/board_porting.rst", "doc/hardware/porting/shields.rst", "doc/hardware/porting/soc_porting.rst",
              "doc/develop/getting_started/*.rst", "doc/services/tracing/index.rst", "doc/hardware/pinctrl/index.rst"]
    # An index.rst that is only a table of contents yields no unit (too little prose); the others are pages.
    exclude: ["doc/develop/west/release-notes.rst", "doc/develop/west/west-apis.rst"]
    license: Apache-2.0
    domain: rtos
    domains:
      - {paths: ["doc/build/*", "doc/develop/west/*", "doc/develop/getting_started/*"], domain: project}
      - {paths: ["doc/hardware/porting/*", "doc/hardware/pinctrl/*"], domain: bring-up}
      - {paths: ["doc/develop/test/*"], domain: test}
      - {paths: ["doc/develop/debug/*", "doc/services/*"], domain: debug}

  - name: executorch-arm
    prefix: etarm
    repo: pytorch/executorch
    sparse: [backends/arm/README.md, docs/source, examples/arm]
    include: ["docs/source/embedded-arm-*.md", "docs/source/backends/arm-ethos-u/**/*.md", "docs/source/backends/arm-cortex-m/*.md",
              "backends/arm/README.md", "examples/arm/README.md", "examples/arm/ethos-u-porting-guide.md", "examples/arm/custom_operators.md",
              "examples/arm/*_ethos_u/README.md", "examples/arm/*_cortex_m/README.md"]
    license: BSD-3-Clause
    domain: edge-ai

  - name: cmsis-dap
    prefix: dap
    repo: ARM-software/CMSIS-DAP
    include: ["Documentation/Doxygen/src/*.md", "Documentation/Doxygen/src/*.txt"]
    format: doxtxt
    license: Apache-2.0
    domain: debug
    url: "https://arm-software.github.io/CMSIS-DAP/latest/{page}.html"
    anchors: false

  - name: cmsis-driver-validation
    prefix: dv
    repo: ARM-software/CMSIS-Driver_Validation
    include: ["Documentation/Doxygen/src/*.txt", "README.md"]
    format: doxtxt
    license: Apache-2.0
    domain: drivers
    url: "https://arm-software.github.io/CMSIS-Driver_Validation/latest/{page}.html"
    anchors: false

  - name: cpackget
    prefix: cpg
    repo: Open-CMSIS-Pack/cpackget
    include: ["README.md"]
    license: Apache-2.0
    domain: pack

  - name: ceedling
    prefix: ceed
    repo: ThrowTheSwitch/Ceedling
    include: ["docs/mkdocs/**/*.md", "docs/mkdocs/*.md"]
    exclude: ["docs/mkdocs/project/*", "docs/mkdocs/development/*", "docs/mkdocs/help.md"]
    license: MIT
    domain: test
    url: "https://throwtheswitch.github.io/Ceedling/{dir}/{stem}/"
    dir_strip: "docs/mkdocs"

  # Trusted Firmware-M: the secure side of Armv8-M (TrustZone, PSA services, secure boot).
  - name: tf-m
    prefix: tfm
    repo: TrustedFirmware-M/trusted-firmware-m
    dir: trusted-firmware-m
    sparse: [docs]
    include: ["docs/introduction/*.rst", "docs/getting_started/*.rst", "docs/building/*.rst", "docs/configuration/**/*.rst",
              "docs/configuration/*.rst", "docs/integration_guide/**/*.rst", "docs/integration_guide/*.rst",
              "docs/design_docs/**/*.rst", "docs/design_docs/*.rst", "docs/platform/**/*.rst", "docs/glossary.rst"]
    exclude: ["*/index.rst", "docs/platform/arm/rse/*"]
    license: BSD-3-Clause
    domain: security
    url: "https://trustedfirmware-m.readthedocs.io/en/latest/{dir}/{stem}.html"
    dir_strip: "docs/"

  - name: llvm-embedded-toolchain
    prefix: llvmet
    repo: ARM-software/LLVM-embedded-toolchain-for-Arm
    include: ["README.md", "docs/*.md"]
    exclude: ["docs/contributing.md", "docs/building-from-source.md"]
    license: Apache-2.0
    domain: project

  # Ethos-U NPU: the Vela compiler and the ML Embedded Evaluation Kit (both on gitlab.arm.com).
  - name: ethos-u-vela
    prefix: vela
    repo: artificial-intelligence/ethos-u/ethos-u-vela
    host: https://gitlab.arm.com
    dir: ethos-u-vela
    include: ["README.md", "OPTIONS.md", "PERFORMANCE.md", "SUPPORTED_OPS.md", "DEBUG_DB.md", "BUGS.md"]
    license: Apache-2.0
    domain: edge-ai

  - name: mlek
    prefix: mlek
    repo: artificial-intelligence/ethos-u/ml-embedded-evaluation-kit
    host: https://gitlab.arm.com
    dir: ml-embedded-evaluation-kit
    sparse: [docs]
    include: ["docs/**/*.md", "docs/*.md"]
    license: Apache-2.0
    domain: edge-ai

  # Arm-Examples with a licence: Helium (MVE) optimization guide, SystemView, AVH VSI, the CMSIS MLEK packs, Ethos-U integration.
  - name: helium-optimization
    prefix: helium
    repo: Arm-Examples/Helium-Optimization
    dir: ae-Helium-Optimization
    include: ["**/*.md", "*.md"]
    license: Apache-2.0
    domain: optimization

  - name: segger-systemview-example
    prefix: sysview
    repo: Arm-Examples/SEGGER-SystemView
    dir: ae-SEGGER-SystemView
    include: ["**/*.md", "*.md"]
    license: Apache-2.0
    domain: trace

  - name: avh-vsi
    prefix: vsi
    repo: Arm-Examples/AVH-VSI
    dir: ae-AVH-VSI
    include: ["README.md", "hello_vsi/README.md", "hello_video_vsi/README.md"]
    license: Apache-2.0
    domain: debug

  - name: cmsis-mlek-packs
    prefix: cmlek
    repo: Arm-Examples/cmsis-mlek
    dir: ae-cmsis-mlek
    include: ["README.md", "docs/*.md", "overview/*.md"]
    license: Apache-2.0
    domain: edge-ai

  - name: cmsis-ethos-integration
    prefix: ethint
    repo: Arm-Examples/CMSIS-Ethos-Integration
    dir: ae-CMSIS-Ethos-Integration
    include: ["README.md", "script/README.md", "Board/*/README.md"]
    license: Apache-2.0
    domain: edge-ai

  - name: debug-adapter-registry
    prefix: dar
    repo: Open-CMSIS-Pack/debug-adapter-registry
    include: ["README.md"]
    license: Apache-2.0
    domain: debug

  # Smaller Open-CMSIS-Pack repositories with a licence: trace setup, the reference application framework
  # (layers and their connections), the component taxonomy, the sensor example, the scalable-software workshop,
  # and the READMEs of cbuild, cbuild2cmake and vidx2pidx.
  - name: ocp-tools-readmes
    prefix: ocp
    repo: Open-CMSIS-Pack/various
    multi:
      - {dir: ocp-pyTS, repo: Open-CMSIS-Pack/pyTS, include: ["README.md"], domain: trace}
      - {dir: ocp-cmsis-trace-extension, repo: Open-CMSIS-Pack/cmsis-trace-extension, include: ["README.md"], domain: trace}
      - {dir: ocp-RefApp-Framework, repo: Open-CMSIS-Pack/RefApp-Framework, include: ["**/README.md", "README.md"], domain: project}
      - {dir: ocp-Open-CMSIS-Pack-Taxonomy, repo: Open-CMSIS-Pack/Open-CMSIS-Pack-Taxonomy, include: ["README.md"], domain: pack}
      - {dir: ocp-Sensor-SDK-Example, repo: Open-CMSIS-Pack/Sensor-SDK-Example, include: ["**/README.md", "README.md"], domain: project}
      - {dir: ocp-Create-Scalable-SW, repo: Open-CMSIS-Pack/Create-Scalable-SW, include: ["README.md", "Demo/*.md"], domain: project}
      - {dir: ocp-cbuild, repo: Open-CMSIS-Pack/cbuild, include: ["README.md"], domain: project}
      - {dir: ocp-cbuild2cmake, repo: Open-CMSIS-Pack/cbuild2cmake, include: ["README.md"], domain: project}
      - {dir: ocp-vidx2pidx, repo: Open-CMSIS-Pack/vidx2pidx, include: ["README.md"], domain: pack}
    license: Apache-2.0
    domain: project
